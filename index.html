ae-4a59-aa45-78bc80c8fa1b","title":"4. Parties communes","text":"* Les affaires personnelles ne doivent pas encombrer les espaces communs.\n* Merci de respecter le mobilier et les équipements mis à disposition.","publication":"published"},{"id":"1330eb7b-e36c-47d3-ac82-0e5682769142","title":"5. Déchets","text":"* Lorsqu'une poubelle est pleine, elle doit être sortie.\n* Ne pas laisser de sacs-poubelle à l'intérieur de l'appartement.","publication":"published"},{"id":"db463a79-1177-41f4-96f3-e748c9dc4f14","title":"6. Invités","text":"* Les invités sont les bienvenus dans le respect des autres colocataires.\n* Les nuits répétées d'un invité ne sont pas autorisées sans accord préalable.\n* Le colocataire est responsable du comportement de ses invités.","publication":"published"},{"id":"3006a073-7183-483d-b826-b0e2fdd45e9c","title":"7. Consommation","text":"* Il est interdit de fumer à l'intérieur du logement.\n* Toute consommation de substances illicites est strictement interdite.","publication":"published"},{"id":"f258c367-783d-42c6-9d4b-6124e6063580","title":"8. Sécurité","text":"* Toujours fermer la porte d'entrée en quittant le logement.\n* Ne jamais prêter les clés sans autorisation.\n* Signaler rapidement toute panne ou dégradation.","publication":"published"},{"id":"3d95926d-f73b-4c4b-a09d-147cbe62495b","title":"9. Chambre","text":"* Chaque chambre est un espace privé.\n* Il est interdit d'entrer dans la chambre d'un autre colocataire sans son autorisation.","publication":"published"},{"id":"7fc2381a-cea7-4e55-950d-f9cb18f24768","title":"10. Respect du logement","text":"* Toute dégradation volontaire pourra être facturée au responsable.\n* Merci de prendre soin du mobilier et des équipements.","publication":"published"},{"id":"e0c1f158-f6d3-44e0-bf3e-9c4c87966172","title":"11. Animaux","text":"* Les animaux ne sont pas autorisés sauf accord écrit du propriétaire.","publication":"published"},{"id":"e97f912b-6da3-4170-ad88-68211419b06b","title":"12. Communication","text":"* En cas de problème entre colocataires, privilégiez toujours le dialogue.\n* Tout problème technique ou incident doit être signalé rapidement au propriétaire ou par le groupe WhatsApp.","publication":"published"},{"id":"bf63ed96-dd0c-4df7-9da6-1e84bcf6c286","title":"Merci !","text":"Ces quelques règles permettent à chacun de vivre dans une ambiance agréable et respectueuse. Merci de votre compréhension et profitez pleinement de votre séjour dans votre logement.","publication":"published"}],"guides":[{"id":"6dc2300b-86b1-4318-9395-30385cc35d31","title":"Chauffage","text":"Le chauffage est réglé automatiquement. Merci de ne pas modifier les réglages.","publication":"published"},{"id":"1357dcaa-c218-4e7b-8a9b-6c1691b0ebb3","title":"Disjoncteurs","text":"Le tableau électrique général se trouve dans les toilettes a l'entrée. Un second tableau est situé à l’étage, dans le couloir.","publication":"published"}],"cleaning":{"people":["Colocataire 1","Colocataire 2"],"tasks":["Cuisine","Salle de bain","Salon et couloir","Poubelles et tri"]},"cleaningHistory":[],"payments":[],"documents":[],"places":[],"wasteCalendar":[],"wasteInstructions":[{"id":"49f406ce-9f2a-4289-ab4b-f91906086d02","title":"Tri sélectif","text":"Indiquez ici les règles de tri du logement.","publication":"published"}],"faq":[{"id":"172d1022-a931-4fe6-873f-c7f8f66213ad","question":"Comment recevoir du courrier ?","answer":"Chaque colocataire peut recevoir son courrier à l’adresse de la colocation.\n\nPour faciliter la distribution, merci d’ajouter votre nom et prénom sur la boîte aux lettres, de préférence avec une petite étiquette propre et lisible.","publication":"published"},{"id":"d04ec075-70ea-4e4d-bbd7-3554bba93c45","question":"Puis-je inviter quelqu’un ?","answer":"Consultez le règlement intérieur concernant les invités.","publication":"published"},{"id":"45e9bd0e-54f5-424c-8825-851b64dedd15","question":"Que faire si je perds mes clés ?","answer":"Contactez le propriétaire dès que possible." nForm"><select name="resource">'+(D.reservationResources||[]).map(x=>'<option>'+e(x.name)+'</option>').join('')+'</select><input name="name" placeholder="Votre prénom" required><input type="date" name="date" required><input type="time" name="time" required><button>Préparer l’e-mail</button></form></div>');h+=section('espaceColocation','Espace colocation','Tableau d’affichage','<div class="cards bulletin">'+(D.bulletin||[]).map(x=>'<article class="card"><small>'+e(fmt(x.date))+'</small><h3>'+e(x.author||'Colocation')+'</h3><p>'+e(x.text)+'</p></article>').join('')+'</div>','dark');if(F.suggestions!==false)h+=section('suggestions','Suggestions','Améliorer le logement','<div class="cta"><h3>Faire une suggestion</h3><form id="suggestionForm"><input name="name" placeholder="Votre prénom" required><textarea name="text" placeholder="Votre idée" rows="4" required></textarea><button>Préparer l’e-mail</button></form></div>','alt');h+='<footer class="footer"><strong>'+e(S.siteName)+'</strong><br><span>'+e(S.subtitle)+'</span></footer>';document.getElementById('app').innerHTML=h;const c=document.getElementById('copyWifi');if(c)c.onclick=async()=>{try{await navigator.clipboard.writeText(S.wifiPassword||'');c.textContent='Copié ✓'}catch{c.textContent='Copiez manuellement'}};function send(subject,body){if(!mail){alert('Aucune adresse e-mail de contact n’est configurée.');return}location.href='mailto:'+encodeURIComponent(mail)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body)}document.getElementById('issueForm')?.addEventListener('submit',ev=>{ev.preventDefault();const f=new FormData(ev.target);send('Signalement colocation — '+f.get('type'),'Prénom : '+f.get('name')+'\nType : '+f.get('type')+'\n\n'+f.get('text'))});document.getElementById('reservationForm')?.addEventListener('submit',ev=>{ev.preventDefault();const f=new FormData(ev.target);send('Demande de réservation — '+f.get('resource'),'Prénom : '+f.get('name')+'\nRessource : '+f.get('resource')+'\nDate
