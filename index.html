4f96-8119-db5e59ec53c3","title":"1.  Respect des colocataires","text":"* Chacun s'engage à respecter les autres occupants.\n* Les insultes, violences, menaces ou comportements irrespectueux ne sont pas tolérés\n* Les parties communes doivent rester agréables pour tous."},{"id":"fd55d103-c6ad-4c74-a682-3cd5bf5a451a","title":"2. Bruit","text":"* Merci de limiter le bruit entre 22h00 et 8h00.\n* Les fêtes sont interdites sans l'accord de tous les colocataires.\n* La musique et la télévision doivent être à un volume raisonnable."},{"id":"c91f7edd-e3a1-445a-b125-fd80d47916dc","title":"3. Propreté","text":"* Chaque colocataire nettoie après son passage.\n* La cuisine doit être propre après chaque utilisation.\n* La vaisselle ne doit pas rester dans l'évier.\nLes sanitaires doivent être laissés propres après utilisation."},{"id":"db6592b2-12ae-4a59-aa45-78bc80c8fa1b","title":"4. Parties communes","text":"* Les affaires personnelles ne doivent pas encombrer les espaces communs.\n* Merci de respecter le mobilier et les équipements mis à disposition."},{"id":"1330eb7b-e36c-47d3-ac82-0e5682769142","title":"5. Déchets","text":"* Lorsqu'une poubelle est pleine, elle doit être sortie.\n* Ne pas laisser de sacs-poubelle à l'intérieur de l'appartement."},{"id":"db463a79-1177-41f4-96f3-e748c9dc4f14","title":"6. Invités","text":"* Les invités sont les bienvenus dans le respect des autres colocataires.\n* Les nuits répétées d'un invité ne sont pas autorisées sans accord préalable.\n* Le colocataire est responsable du comportement de ses invités."},{"id":"3006a073-7183-483d-b826-b0e2fdd45e9c","title":"7. Consommation","text":"* Il est interdit de fumer à l'intérieur du logement.\n* Toute consommation de substances illicites est strictement interdite."},{"id":"f258c367-783d-42c6-9d4b-6124e6063580","title":"8. Sécurité","text":"* Toujours fermer la porte d'entrée en quittant le logement.\n* Ne jamais prêter les clés sans autorisation.\n* Signaler rapidement toute panne ou dégradation."},{"id":"3d95926d-f73b-4c4b-a09d-147cbe62495b","title":"9. Chambre","text":"* Chaque chambre est un espace privé.\n* Il est interdit d'entrer dans la chambre d'un autre colocataire sans son autorisation."},{"id":"7fc2381a-cea7-4e55-950d-f9cb18f24768","title":"10. Respect du logement","text":"* Toute dégradation volontaire pourra être facturée au responsable.\n* Merci de prendre soin du mobilier et des équipements."},{"id":"e0c1f158-f6d3-44e0-bf3e-9c4c87966172","title":"11. Animaux","text":"* Les animaux ne sont pas autorisés sauf accord écrit du propriétaire."},{"id":"e97f912b-6da3-4170-ad88-68211419b06b","title":"12. Communication","text":"* En cas de problème entre colocataires, privilégiez toujours le dialogue.\n* Tout problème technique ou incident doit être signalé rapidement au propriétaire ou par le groupe WhatsApp."},{"id":"bf63ed96-dd0c-4df7-9da6-1e84bcf6c286","title":"Merci !","text":"Ces quelques règles permettent à chacun de vivre dans une ambiance agréable et respectueuse. Merci de votre compréhension et profitez pleinement de votre séjour dans votre logement."}],"guides":[{"id":"6dc2300b-86b1-4318-9395-30385cc35d31","title":"Chauffage","text":"Le chauffage est réglé automatiquement. Merci de ne pas modifier les réglages."},{"id":"1357dcaa-c218-4e7b-8a9b-6c1691b0ebb3","title":"Disjoncteurs","text":"Le tableau électrique général se trouve dans les toilettes a l'entrée. Un second tableau est situé à l’étage, dans le couloir."}],"cleaning":{"people":["Colocataire 1","Colocataire 2"],"tasks":["Cuisine","Salle de bain","Salon et couloir","Poubelles et tri"]},"cleaningHistory":[],"payments":[],"documents":[],"places":[],"wasteCalendar":[],"wasteInstructions":[{"id":"49f406ce-9f2a-4289-ab4b-f91906086d02","title":"Tri sélectif","text":"Indiquez ici les règles de tri du logement."}],"faq":[{"id":"172d1022-a931-4fe6-873f-c7f8f66213ad","question":"Comment recevoir du courrier ?","answer":"Chaque colocataire peut recevoir son courrier à l’adresse de la colocation.\n\nPour faciliter la distribution, merci d’ajouter votre nom et prénom sur la boîte aux lettres, de préférence avec une petite étiquette propre et lisible."},{"id":"d04ec075-70ea-4e4d-bbd7-3554bba93c45","question":"Puis-je inviter quelqu’un ?","answer":"Consultez le règlement intérieur concernant les invités."},{"id":"45e9bd0e-54f5-424c-8825-851b64dedd15","question":"Que faire si je perds mes clés ?","answer":"Contactez le propriétaire dès que possible."}],"contacts":[{"id":"f66fd235-6fdc-46b6-acdd-2edf426408b8","role":"Propriétaire","name":"Alexandre","phone":"06 37 33 90 34"},{"id":"f34c565b-4ce8-4677-b1f6-f40ed534a7a6","role":"Urgences","name":"Urgences européennes","phone":"112"},{"id":"882b9070-604a-4f3e-8a58-238dc3b16db8","role":"Police","name":"Police","phone":"17"},{"id":"81a28a8b-a3df-47a7-8b8c-0d55f0a0610e","role":"Pompiers","name":"Pompiers","phone":"18"}],"announcements":[{"id":"2defc783-3924-4e25-98b3-a244edc061ea","date":"","title":"Aucune","text":""}],"reservationResources":[{"id":"5f6de3c2-283d-4fa9-abd6-cefced9b91dc","name":"Machine à laver","detail":"Réservation par e-mail"},{"id":"73026310-a15f-426b-a5f9-d75680cb180a","name":"Place de parking","detail":"Si disponible"}],"bulletin":[]}</script><script>(()=>{const D=JSON.parse(document.getElementById('site-data').textContent),S=D.settings,F=D.features||{};const e=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const tel=s=>String(s||'').replace(/\s/g,'');const mail=S.ownerEmail||'';const menu=[['accueil','Accueil'],['reglement','Règlement'],['guide','Guide'],['menage','Ménage'],['signalement','Signaler'],['paiements','Paiements'],['documents','Documents'],['autour','Autour'],['dechets','Déchets'],['faq','FAQ'],['contacts','Contacts'],['annonces','Annonces'],['reservations','Réservations'],['espaceColocation','Colocation'],['suggestions','Suggestions']].filter(x=>F[x[0]]!==false);const nav=menu.map(x=>'<a href="#'+x[0]+'">'+x[1]+'</a>').join('') if(F.signalement!==false)h+=section('signalement','Signaler un problème','Maintenance','<div class="cta"><h3>Envoyer un signalement</h3><form id="issueForm"><select name="type"><option>Ampoule grillée</option><option>Fuite</option><option>Chauffage en panne</option><option>Internet</option><option>Électroménager</option><option>Autre</option></select><input name="name" placeholder="Votre prénom" required><textarea name="text" placeholder="Décrivez le problème" rows="4" required></textarea><button>Préparer l’e-mail</button><p class="notice">Votre application e-mail s’ouvrira. Vous pourrez ensuite joindre une photo manuellement.</p></form></div>','alt');
if(F.paiements!==false)h+=section('paiements','Paiements','Suivi','<div class="rent"><div><small>Prochain loyer</small><h3>'+e(S.nextRentDate||'À définir')+'</h3><p>'+e(S.charges||'')+'</p></div><strong>'+e(S.rentAmount||'')+'</strong></div>'+cards(D.payments,x=>'<article class="card"><small>'+e(x.month)+'</small><h3>'+e(x.amount)+'</h3><p>'+e(x.status)+'</p></article>'),'dark');
h+=section('documents','Documents','Fichiers utiles',cards(D.documents,x=>'<article class="card doc"><h3>'+e(x.title)+'</h3><p>'+e(x.description)+'</p>'+(x.url?'<a href="'+e(x.url)+'" target="_blank" rel="noopener">Ouvrir →</a>':'')+'</article>'),'alt');h+=section('autour','Autour de la colocation','À proximité',cards(D.places,x=>'<article class="card place"><small>'+e(x.category)+'</small><h3>'+e(x.name)+'</h3><p>'+e(x.detail)+'</p>'+(x.url?'<a href="'+e(x.url)+'" target="_blank" rel="noopener">Voir →</a>':'')+'</article>'));

h+=section('espaceColocation','Espace colocation','Tableau d’affichage','<div class="cards bulletin">'+(D.bulletin||[]).map(x=>'<article class="card"><small>'+e(x.date)+'</small><h3>'+e(x.author||'Colocation')+'</h3><p>'+e(x.text)+'</p></article>').join('')+'</div>','dark');
if(F.suggestions!==false)h+=section('suggestions','Suggestions','Améliorer le logement','<div class="cta"><h3>Faire une suggestion</h3><form id="suggestionForm"><input name="name" placeholder="Votre prénom" required><textarea name="text" placeholder="Votre idée" rows="4" required></textarea><button>Préparer l’e-mail</button></form></div>','alt');h+='<footer class="footer"><strong>'+e(S.siteName)+'</strong><br><span>'+e(S.subtitle)+'</span></footer>';document.getElementById('app').innerHTML=h;const c=document.getElementById('copyWifi');if(c)c.onclick=async()=>{try{await navigator.clipboard.writeText(S.wifiPassword||'');c.textContent='Copié ✓'}catch{c.textContent='Sélectionnez le mot de passe'}};function send(subject,body){if(!mail){alert('Aucune adresse e-mail de contact n’est configurée.');return}location.href='mailto:'+encodeURIComponent(mail)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body)}document.getElementById('issueForm')?.addEventListener('submit',ev=>{ev.preventDefault();const f=new FormData(ev.target);send('Signalement colocation — '+f.get('type'),'Prénom : '+f.get('name')+'\nType : '+f.get('type')+'\n\n'+f.get('text')+'\n\nJe peux joindre une photo à cet e-mail.')});document.getElementById('reservationForm')?.addEventListener('submit',ev=>{ev.preventDefault();const f=new FormData(ev.target);send('Demande de réservation — '+f.get('resource'),'Prénom : '+f.get('name')+'\nRessource : '+f.get('resource')+'\nDate : '+f.get('date')+'\nHeure : '+f.get('time'))});document.getElementById('suggestionForm')?.addEventListener('submit',ev=>{ev.preventDefault();const f=new FormData(ev.target);send('Suggestion colocation','Prénom : '+f.get('name')+'\n\n'+f.get('text'))})})();</script></body></html>
